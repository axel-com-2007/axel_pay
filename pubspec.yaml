name: axelpay
description: "AxelPay — application mobile cliente Eneo (frontend uniquement, données de test)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Graphique d'évolution de consommation (écran Postpayé)
  fl_chart: ^0.68.0
  # Formatage des montants FCFA et des dates
  intl: ^0.19.0
  dio: ^5.10.0
  flutter_secure_storage: ^9.0.0 # stockage sécurisé des tokens JWT
  provider: ^6.1.0
  # Illustrations animées (splash, états vides, micro-interactions FAQ,
  # export RGPD, attente de paiement...) — voir lib/widgets/animations/animations.dart
  lottie: ^3.1.0
  sqflite_sqlcipher: ^3.1.0
  connectivity_plus: ^6.0.0
  flutter_map: ^8.0.0
  latlong2: ^0.9.1
   # Position GPS de l'utilisateur
  geolocator: ^14.0.2
  sensors_plus: ^6.1.1
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  video_player: ^2.10.0
  pdf: ^3.10.8
  printing: ^5.13.1
  

  # Demande des permissions (Android/iOS)
  permission_handler: ^12.0.1
  url_launcher: ^6.3.2
  flutter_map_animations: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
   
    - assets/animations/
    
    - assets/images/
